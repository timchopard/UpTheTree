<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content="noindex"><title>Thank you · Up the Tree</title><style>:root{--bg:#fdf8f0;--text:#2f2418;--muted:#6b5a47;--star:#f5b82e;--star-glow:rgba(245, 184, 46, .35);--accent:#b5562b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,segoe ui,Roboto,sans-serif;text-align:center;padding:24px 16px}main{max-width:32rem}.stage{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:0 auto 1.5rem;cursor:pointer}.star,.squirrel{position:absolute;inset:0;margin:auto}.star{width:100%;height:100%;fill:var(--star);filter:drop-shadow(0 0 18px var(--star-glow));transform:scale(0)rotate(-30deg);animation:star 1.4s cubic-bezier(.34,1.56,.64,1)1.1s forwards}.squirrel{width:70%;height:70%;object-fit:contain;z-index:1;animation:spin 1.2s cubic-bezier(.45,.05,.35,1)both}@keyframes spin{0%{transform:translateY(0)rotate(0)scale(.6);opacity:0}15%{opacity:1}50%{transform:translateY(-12%)rotate(200deg)scale(1.05)}100%{transform:translateY(0)rotate(360deg)scale(1);opacity:1}}@keyframes star{0%{transform:scale(0)rotate(-30deg)}45%{transform:scale(1.25)rotate(10deg)}75%{transform:scale(.8)rotate(0)}100%{transform:scale(.95)rotate(0)}}h1{font-size:clamp(1.8rem,6vw,2.6rem);margin:0 0 .5rem}p{color:var(--muted);font-size:1.1rem;line-height:1.5;margin:0 0 1.75rem}.fade{opacity:0;animation:fade .6s ease 2s forwards}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.btn{display:inline-block;padding:.75rem 1.5rem;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;margin:.25rem}.btn.ghost{background:0 0;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}@media(prefers-reduced-motion:reduce){.squirrel,.star,.fade{animation:none;opacity:1}.star{transform:scale(.95)}}</style></head><body><main><div class=stage title=Again!><svg class="star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4l13.4 29.2 31.9 3.7-23.6 21.8 6.4 31.5L50 74.4 21.9 90.2l6.4-31.5L4.7 36.9l31.9-3.7z"/></svg>
<img class=squirrel src=https://upthetree.ch/images/squirrel.webp alt="Up the Tree squirrel"></div><div class=fade><h1 id=title>Thank you!</h1><p id=msg>We've got your message and will get back to you soon.</p><a class=btn href=/shows/>See upcoming shows</a>
<a class="btn ghost" href=/>Back home</a></div></main><script>var from=new URLSearchParams(location.search).get("from");from==="newsletter"&&(document.getElementById("title").textContent="You're up the tree!",document.getElementById("msg").textContent="Thanks for subscribing. We'll let you know when the next show is coming."),document.querySelector(".stage").addEventListener("click",function(){this.querySelectorAll(".star, .squirrel").forEach(function(e){e.style.animation="none",e.offsetHeight,e.style.animation=""})})</script></body></html>

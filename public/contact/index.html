  <script>
    (function () {
      const header = document.querySelector('.site-header');
      const btn = document.querySelector('.nav-toggle');
      const nav = document.getElementById('site-nav');
      if (!header || !btn || !nav) return;

      function setOpen(open) {
        header.classList.toggle('is-open', open);
        btn.setAttribute('aria-expanded', String(open));
      }

      btn.addEventListener('click', () => {
        const open = !header.classList.contains('is-open');
        setOpen(open);
      });

      
      nav.addEventListener('click', (e) => {
        const a = e.target.closest('a');
        if (!a) return;
        setOpen(false);
      });

      
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') setOpen(false);
      });
    })();
  </script>

<article class="card">
  <h1>Contact</h1>
  <p>Get in touch with us using the form below.</p>
<form class="contact-form" action="https://forms.cloudberries.io/submit" method="POST">
  <input type="hidden" name="site" value="upthetree">

  <label for="cf-name">Name</label>
  <input id="cf-name" type="text" name="name" required maxlength="200" autocomplete="name">

  <label for="cf-email">Email</label>
  <input id="cf-email" type="email" name="email" required maxlength="254" autocomplete="email">

  <label for="cf-message">Message</label>
  <textarea id="cf-message" name="message" required maxlength="5000" rows="6"></textarea>

  
  <div aria-hidden="true" style="position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden">
    <label for="cf-gotcha">Leave this field empty</label>
    <input id="cf-gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off">
  </div>

  <button type="submit">Send</button>
</form>
